# Local development services. Not a production deployment configuration —
# see README.md "Deployment".
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cohortcove
      POSTGRES_PASSWORD: cohortcove
      POSTGRES_DB: cohortcove
    ports:
      - "5432:5432"
    volumes:
      - cohortcove_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cohortcove"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cohortcove_pg_data:
